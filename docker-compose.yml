
services:
  mongo:
    image: mongo:6
    container_name: taskhub-mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    restart: unless-stopped

  backend:
    build: 
      context: ./backend
      dockerfile: Dockerfile
    container_name: taskhub-backend
    ports:
      - "4000:4000"
    environment:
      - NODE_ENV=development
      - PORT=4000
      - MONGO_URI=mongodb://mongo:27017/taskhub
    depends_on:
      - mongo
    restart: unless-stopped

volumes:
  mongo-data:
